<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="600" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowR">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL">
      <stop offset="0%" stop-color="#EC4899" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ambient glows -->
  <circle cx="900" cy="150" r="190" fill="url(#glowR)">
    <animate attributeName="r" values="180;200;180" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="90" r="220" fill="url(#glowL)"/>

  <!-- Orbit rings -->
  <g transform="rotate(-16 900 150)" fill="none" stroke="url(#ringGrad)">
    <ellipse cx="900" cy="150" rx="190" ry="95" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <ellipse cx="900" cy="150" rx="125" ry="62" stroke-opacity=".25" stroke-width="1"/>
    <g stroke="none">
      <circle r="9" fill="#22D3EE" opacity=".6" filter="url(#soft)">
        <animateMotion dur="14s" repeatCount="indefinite" path="M710 150 A190 95 0 1 1 1090 150 A190 95 0 1 1 710 150 Z"/>
      </circle>
      <circle r="3.5" fill="#22D3EE">
        <animateMotion dur="14s" repeatCount="indefinite" path="M710 150 A190 95 0 1 1 1090 150 A190 95 0 1 1 710 150 Z"/>
      </circle>
      <circle r="9" fill="#EC4899" opacity=".6" filter="url(#soft)">
        <animateMotion dur="10s" repeatCount="indefinite" path="M775 150 A125 62 0 1 0 1025 150 A125 62 0 1 0 775 150 Z"/>
      </circle>
      <circle r="3" fill="#F472B6">
        <animateMotion dur="10s" repeatCount="indefinite" path="M775 150 A125 62 0 1 0 1025 150 A125 62 0 1 0 775 150 Z"/>
      </circle>
    </g>
  </g>

  <!-- Rising particles -->
  <g fill="#C4B5FD">
    <circle cx="830" cy="280" r="1.8"><animate attributeName="cy" values="285;15" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="285" r="1.4"><animate attributeName="cy" values="285;15" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="280" r="2"><animate attributeName="cy" values="285;15" dur="9s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="285" r="1.5"><animate attributeName="cy" values="285;15" dur="11s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="11s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="280" r="1.8"><animate attributeName="cy" values="285;15" dur="9.5s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9.5s" begin="-5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Isometric glass stack (bottom → top) ===== -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">

    <!-- MongoDB -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" begin="-4.5s" repeatCount="indefinite"/>
      <g transform="translate(900 236)" color="#EC4899">
        <path d="M-80 0 L0 46 L0 54 L-80 8 Z" fill="currentColor" fill-opacity=".35"/>
        <path d="M80 0 L0 46 L0 54 L80 8 Z" fill="currentColor" fill-opacity=".55"/>
        <path d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/>
        <path d="M-60 0 L0 -34.6 L60 0 L0 34.6 Z" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4"/>
        <text transform="matrix(0.866 0.5 -0.866 0.5 0 0)" text-anchor="middle" dominant-baseline="middle" fill="currentColor">MONGODB</text>
      </g>
    </g>

    <!-- Express -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <g transform="translate(900 178)" color="#A855F7">
        <path d="M-80 0 L0 46 L0 54 L-80 8 Z" fill="currentColor" fill-opacity=".35"/>
        <path d="M80 0 L0 46 L0 54 L80 8 Z" fill="currentColor" fill-opacity=".55"/>
        <path d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/>
        <path d="M-60 0 L0 -34.6 L60 0 L0 34.6 Z" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4"/>
        <text transform="matrix(0.866 0.5 -0.866 0.5 0 0)" text-anchor="middle" dominant-baseline="middle" fill="currentColor">EXPRESS</text>
      </g>
    </g>

    <!-- Node.js -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" begin="-1.5s" repeatCount="indefinite"/>
      <g transform="translate(900 120)" color="#6366F1">
        <path d="M-80 0 L0 46 L0 54 L-80 8 Z" fill="currentColor" fill-opacity=".35"/>
        <path d="M80 0 L0 46 L0 54 L80 8 Z" fill="currentColor" fill-opacity=".55"/>
        <path d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/>
        <path d="M-60 0 L0 -34.6 L60 0 L0 34.6 Z" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4"/>
        <text transform="matrix(0.866 0.5 -0.866 0.5 0 0)" text-anchor="middle" dominant-baseline="middle" fill="currentColor">NODE.JS</text>
      </g>
    </g>

    <!-- React -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" begin="0s" repeatCount="indefinite"/>
      <g transform="translate(900 62)" color="#22D3EE">
        <path d="M-80 0 L0 46 L0 54 L-80 8 Z" fill="currentColor" fill-opacity=".35"/>
        <path d="M80 0 L0 46 L0 54 L80 8 Z" fill="currentColor" fill-opacity=".55"/>
        <path d="M-80 0 L0 -46 L80 0 L0 46 Z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M-60 0 L0 -34.6 L60 0 L0 34.6 Z" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 4"/>
        <text transform="matrix(0.866 0.5 -0.866 0.5 0 0)" text-anchor="middle" dominant-baseline="middle" fill="currentColor">REACT</text>
      </g>
    </g>
  </g>

  <!-- ===== Left content ===== -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" dur="1.2s" begin="0s" fill="freeze"/>

    <!-- eyebrow -->
    <rect x="90" y="69" width="36" height="3" rx="1.5" fill="url(#ringGrad)"/>
    <text x="140" y="76" font-size="14" font-weight="600" letter-spacing="5" fill="#94A3B8">MERN STACK DEVELOPER</text>

    <!-- name -->
    <text x="88" y="152" font-size="70" fill="url(#nameGrad)" letter-spacing="-1"><tspan font-weight="500">Ritik Raj Soni</tspan></text>

    <!-- animated underline -->
    <path d="M92 178 H330" pathLength="1" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="1" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.4s" begin="0.6s" fill="freeze"/>
    </path>

    <!-- tagline -->
    <text x="90" y="216" font-size="20" font-weight="400" letter-spacing=".4" fill="#94A3B8">Crafting fast, scalable &amp; elegant web experiences.</text>

    <!-- status -->
    <g transform="translate(90 252)">
      <circle cx="5" cy="0" r="9" fill="#10B981" opacity=".3">
        <animate attributeName="r" values="4;11;4" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="5" cy="0" r="4" fill="#10B981"/>
      <text x="20" y="5" font-size="14" font-weight="500" letter-spacing="1" fill="#94A3B8">Open to opportunities</text>
    </g>
  </g>
</svg>
