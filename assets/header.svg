
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="300"
     viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#17102D"/>
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="600" cy="140" rx="500" ry="180" fill="url(#light)"/>

  <!-- Animated waves -->
  <path fill="url(#wave)" opacity=".35">
    <animate attributeName="d" dur="18s"
      repeatCount="indefinite"
      values="
      M0 190 Q300 110 600 180 T1200 170 L1200 300 L0 300 Z;
      M0 160 Q300 230 600 150 T1200 200 L1200 300 L0 300 Z;
      M0 190 Q300 110 600 180 T1200 170 L1200 300 L0 300 Z"/>
  </path>

  <path fill="url(#wave2)" opacity=".3">
    <animate attributeName="d" dur="22s"
      repeatCount="indefinite"
      begin="-10s"
      values="
      M0 220 Q300 140 600 210 T1200 190 L1200 300 L0 300 Z;
      M0 180 Q300 250 600 190 T1200 220 L1200 300 L0 300 Z;
      M0 220 Q300 140 600 210 T1200 190 L1200 300 L0 300 Z"/>
  </path>

  <path fill="url(#wave)" opacity=".2">
    <animate attributeName="d" dur="25s"
      repeatCount="indefinite"
      begin="-5s"
      values="
      M0 250 Q300 180 600 240 T1200 230 L1200 300 L0 300 Z;
      M0 220 Q300 280 600 220 T1200 250 L1200 300 L0 300 Z;
      M0 250 Q300 180 600 240 T1200 230 L1200 300 L0 300 Z"/>
  </path>

  <!-- Main heading -->
  <text x="600" y="112"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="1"
        fill="#FFFFFF">
    Ritik Raj Soni
  </text>

  <!-- Subtitle -->
  <text x="600" y="165"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="19"
        font-weight="500"
        letter-spacing="3"
        fill="#D8C8FF">
    MERN STACK DEVELOPER
  </text>

  <!-- Fade animation -->
  <animate attributeName="opacity"
           values="0.96;1;0.96"
           dur="5s"
           repeatCount="indefinite"/>

</svg>
